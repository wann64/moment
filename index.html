<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Moments</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(255,255,255,0.06),
                    transparent 22%
                ),
                radial-gradient(
                    circle at 85% 30%,
                    rgba(255,255,255,0.045),
                    transparent 25%
                ),
                #080808;

            color: #f5f5f5;

            min-height: 100vh;

            overflow-x: hidden;
        }


        /* =====================================
           GLITTER BACKGROUND
        ===================================== */

        .glitter {
            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: 0;

            overflow: hidden;
        }

        .sparkle {
            position: absolute;

            width: 2px;
            height: 2px;

            background: white;

            border-radius: 50%;

            opacity: 0.15;

            box-shadow:
                0 0 5px rgba(255,255,255,0.8);

            animation:
                sparkle 4s ease-in-out infinite;
        }

        @keyframes sparkle {

            0%, 100% {
                opacity: 0.08;
                transform: scale(0.7);
            }

            50% {
                opacity: 0.8;
                transform: scale(1.8);
            }
        }


        /* =====================================
           CONTENT
        ===================================== */

        header,
        main,
        footer {
            position: relative;

            z-index: 1;
        }


        /* =====================================
           HEADER
        ===================================== */

        header {
            text-align: center;

            padding:
                50px
                20px
                32px;
        }

        header h1 {
            font-size: 30px;

            font-weight: 500;

            letter-spacing: 1px;

            color: #ffffff;

            text-shadow:
                0 0 18px
                rgba(255,255,255,0.12);
        }

        header p {
            margin-top: 9px;

            font-size: 13px;

            color: #888;

            letter-spacing: 0.5px;
        }


        /* =====================================
           CONTAINER
        ===================================== */

        .container {
            width: 94%;

            max-width: 1200px;

            margin: auto;
        }


        /* =====================================
           GALLERY HEADER
        ===================================== */

        .gallery-header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin:
                10px
                0
                22px;
        }

        .gallery-header h2 {

            font-size: 18px;

            font-weight: 500;

            color: #eeeeee;
        }

        #count {

            font-size: 12px;

            color: #666;
        }


        /* =====================================
           PINTEREST GALLERY
        ===================================== */

        .gallery {

            columns:
                5
                180px;

            column-gap: 16px;

            padding-bottom: 60px;
        }


        .photo {

            break-inside: avoid;

            margin-bottom: 16px;

            border-radius: 12px;

            overflow: hidden;

            background: #111;

            cursor: pointer;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.35);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;

            animation:
                appear 0.6s ease;
        }


        .photo:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.55);
        }


        .photo img {

            display: block;

            width: 100%;

            height: auto;

            transition:
                transform 0.4s ease,
                filter 0.4s ease;
        }


        .photo:hover img {

            transform:
                scale(1.025);

            filter:
                brightness(0.9);
        }


        @keyframes appear {

            from {

                opacity: 0;

                transform:
                    translateY(15px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =====================================
           EMPTY / ERROR
        ===================================== */

        .message {

            text-align: center;

            padding:
                70px
                20px;

            color: #777;

            font-size: 14px;
        }


        /* =====================================
           MODAL FOTO
        ===================================== */

        .modal {

            position: fixed;

            inset: 0;

            z-index: 100;

            display: none;

            justify-content: center;

            align-items: center;

            padding: 20px;

            background:
                rgba(0,0,0,0.94);

            backdrop-filter:
                blur(10px);
        }


        .modal.show {

            display: flex;
        }


        .modal img {

            max-width: 92vw;

            max-height: 88vh;

            object-fit: contain;

            border-radius: 10px;

            box-shadow:
                0 15px 60px
                rgba(0,0,0,0.7);

            animation:
                zoom 0.25s ease;
        }


        @keyframes zoom {

            from {

                opacity: 0;

                transform:
                    scale(0.94);
            }

            to {

                opacity: 1;

                transform:
                    scale(1);
            }
        }


        .close {

            position: fixed;

            top: 18px;

            right: 25px;

            z-index: 101;

            font-size: 34px;

            color: #ddd;

            cursor: pointer;

            line-height: 1;

            transition:
                color 0.2s ease;
        }


        .close:hover {

            color: white;
        }


        /* =====================================
           FOOTER
        ===================================== */

        footer {

            text-align: center;

            padding:
                20px;

            color: #555;

            font-size: 11px;

            letter-spacing: 0.5px;
        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 700px) {

            header {

                padding-top: 38px;
            }


            header h1 {

                font-size: 26px;
            }


            .gallery {

                columns:
                    2
                    140px;

                column-gap: 10px;
            }


            .photo {

                margin-bottom: 10px;

                border-radius: 9px;
            }
        }

    </style>
</head>


<body>


    <!-- =====================================
         GLITTER
    ===================================== -->

    <div
        class="glitter"
        id="glitter"
    ></div>


    <!-- =====================================
         HEADER
    ===================================== -->

    <header>

        <h1>
            Our Moments
        </h1>

        <p>
            little moments worth remembering
        </p>

    </header>


    <!-- =====================================
         CONTENT
    ===================================== -->

    <main class="container">


        <div class="gallery-header">

            <h2>
                Memories
            </h2>

            <span id="count">
                Loading...
            </span>

        </div>


        <!-- GALLERY -->

        <div
            class="gallery"
            id="gallery"
        ></div>


        <!-- MESSAGE -->

        <div
            class="message"
            id="message"
        >
            Loading photos...
        </div>


    </main>


    <!-- =====================================
         FOOTER
    ===================================== -->

    <footer>

        made with little memories ♡

    </footer>


    <!-- =====================================
         MODAL
    ===================================== -->

    <div
        class="modal"
        id="modal"
    >

        <span
            class="close"
            onclick="closeModal()"
        >
            ×
        </span>

        <img
            id="modalImage"
            src=""
            alt="Photo"
        >

    </div>


    <script>


        /* =====================================
           GITHUB CONFIG
        ===================================== */

        const USERNAME =
            "wann64";

        const REPOSITORY =
            "moment";

        const FOLDER =
            "moment";


        /* =====================================
           ELEMENT
        ===================================== */

        const gallery =
            document.getElementById(
                "gallery"
            );

        const message =
            document.getElementById(
                "message"
            );

        const count =
            document.getElementById(
                "count"
            );

        const modal =
            document.getElementById(
                "modal"
            );

        const modalImage =
            document.getElementById(
                "modalImage"
            );


        /* =====================================
           CREATE GLITTER
        ===================================== */

        const glitter =
            document.getElementById(
                "glitter"
            );


        for (
            let i = 0;
            i < 90;
            i++
        ) {

            const sparkle =
                document.createElement(
                    "div"
                );


            sparkle.className =
                "sparkle";


            sparkle.style.left =
                Math.random() * 100 +
                "%";


            sparkle.style.top =
                Math.random() * 100 +
                "%";


            sparkle.style.animationDelay =
                Math.random() * 5 +
                "s";


            sparkle.style.animationDuration =
                (
                    3 +
                    Math.random() * 4
                ) +
                "s";


            const size =
                Math.random() > 0.9
                    ? 3
                    : 2;


            sparkle.style.width =
                size + "px";


            sparkle.style.height =
                size + "px";


            glitter.appendChild(
                sparkle
            );

        }


        /* =====================================
           LOAD FOTO DARI GITHUB
        ===================================== */

        async function loadPhotos() {

            try {

                const apiURL =
                    `https://api.github.com/repos/` +
                    `${USERNAME}/` +
                    `${REPOSITORY}/contents/` +
                    `${FOLDER}`;


                const response =
                    await fetch(
                        apiURL,
                        {
                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "GitHub API Error"
                    );

                }


                const files =
                    await response.json();


                /* Hanya gambar */

                const images =
                    files.filter(
                        file => {

                            return (
                                file.type === "file" &&
                                /\.(jpg|jpeg|png|gif|webp|avif)$/i
                                .test(
                                    file.name
                                )
                            );

                        }
                    );


                gallery.innerHTML =
                    "";


                /* =================================
                   TIDAK ADA FOTO
                ================================= */

                if (
                    images.length === 0
                ) {

                    count.textContent =
                        "0 photos";


                    message.style.display =
                        "block";


                    message.textContent =
                        "Belum ada foto.";


                    return;

                }


                /* =================================
                   ADA FOTO
                ================================= */

                message.style.display =
                    "none";


                count.textContent =
                    images.length +
                    (
                        images.length === 1
                            ? " photo"
                            : " photos"
                    );


                /* =================================
                   TAMPILKAN FOTO
                ================================= */

                images.forEach(
                    (file, index) => {

                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "photo";


                        const img =
                            document.createElement(
                                "img"
                            );


                        img.src =
                            `https://raw.githubusercontent.com/` +
                            `${USERNAME}/` +
                            `${REPOSITORY}/` +
                            `${file.path}`;


                        img.alt =
                            `Memory ${index + 1}`;


                        img.loading =
                            "lazy";


                        img.onclick =
                            function () {

                                openModal(
                                    img.src
                                );

                            };


                        card.appendChild(
                            img
                        );


                        gallery.appendChild(
                            card
                        );

                    }
                );


            }


            catch (error) {

                console.error(
                    error
                );


                count.textContent =
                    "Error";


                message.style.display =
                    "block";


                message.innerHTML = `

                    <p>
                        Tidak dapat memuat foto.
                    </p>

                    <small>
                        Pastikan repository Public
                        dan folder "moment" tersedia.
                    </small>

                `;

            }

        }


        /* =====================================
           MODAL
        ===================================== */

        function openModal(src) {

            modalImage.src =
                src;

            modal.classList.add(
                "show"
            );

        }


        function closeModal() {

            modal.classList.remove(
                "show"
            );

            modalImage.src =
                "";

        }


        /* Klik luar foto */

        modal.addEventListener(
            "click",
            function(event) {

                if (
                    event.target ===
                    modal
                ) {

                    closeModal();

                }

            }
        );


        /* ESC */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key ===
                    "Escape"
                ) {

                    closeModal();

                }

            }
        );


        /* =====================================
           START
        ===================================== */

        loadPhotos();

    </script>

</body>
</html>
