<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Moments ✦</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", sans-serif;
            color: white;
            overflow-x: hidden;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(93, 116, 255, 0.25),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 25%,
                    rgba(157, 91, 255, 0.25),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 50% 85%,
                    rgba(56, 100, 255, 0.18),
                    transparent 35%
                ),
                #030411;
        }


        /* =========================
           STAR BACKGROUND
        ========================= */

        .stars {
            position: fixed;
            inset: 0;

            z-index: -1;

            pointer-events: none;

            overflow: hidden;
        }

        .star {
            position: absolute;

            width: 2px;
            height: 2px;

            background: white;

            border-radius: 50%;

            animation: twinkle
                3s
                ease-in-out
                infinite;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.15;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.8);
            }
        }


        /* =========================
           HEADER
        ========================= */

        header {
            text-align: center;

            padding:
                65px
                20px
                35px;
        }

        .moon {
            font-size: 55px;

            margin-bottom: 12px;

            filter:
                drop-shadow(
                    0 0 20px
                    rgba(180, 195, 255, 0.9)
                );

            animation:
                floating
                4s
                ease-in-out
                infinite;
        }

        @keyframes floating {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }


        h1 {
            font-size:
                clamp(
                    38px,
                    8vw,
                    70px
                );

            letter-spacing: 5px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #a9c7ff,
                    #d8b7ff,
                    #ffffff
                );

            background-size: 300%;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation:
                galaxyText
                6s
                linear
                infinite;
        }

        @keyframes galaxyText {

            from {
                background-position: 0%;
            }

            to {
                background-position: 300%;
            }
        }

        .subtitle {
            margin-top: 12px;

            color: #aeb8dc;

            font-size: 14px;

            letter-spacing: 2px;
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {
            width:
                min(
                    1100px,
                    92%
                );

            margin: auto;
        }


        /* =========================
           GALLERY HEADER
        ========================= */

        .gallery-header {
            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin:
                35px
                0
                20px;
        }

        .gallery-header h2 {
            font-size: 21px;

            font-weight: 600;
        }

        #count {
            color: #8994bd;

            font-size: 13px;
        }


        /* =========================
           GALLERY
        ========================= */

        .gallery {
            columns:
                4
                220px;

            column-gap: 18px;

            padding-bottom: 60px;
        }

        .photo {
            break-inside: avoid;

            margin-bottom: 18px;

            border-radius: 18px;

            overflow: hidden;

            background:
                rgba(
                    20,
                    25,
                    55,
                    0.7
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            box-shadow:
                0
                12px
                35px
                rgba(
                    0,
                    0,
                    0,
                    0.4
                );

            animation:
                appear
                0.7s
                ease
                forwards;
        }

        @keyframes appear {

            from {
                opacity: 0;

                transform:
                    translateY(20px)
                    scale(0.97);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }

        .photo img {
            width: 100%;

            display: block;

            cursor: pointer;

            transition:
                transform
                0.5s
                ease,
                filter
                0.5s
                ease;
        }

        .photo:hover img {
            transform: scale(1.06);

            filter:
                brightness(1.08);
        }


        /* =========================
           LOADING / EMPTY
        ========================= */

        .message {
            text-align: center;

            padding:
                70px
                20px;

            color: #7782ad;
        }

        .message-icon {
            font-size: 50px;

            margin-bottom: 15px;
        }


        /* =========================
           MODAL
        ========================= */

        .modal {
            position: fixed;

            inset: 0;

            z-index: 100;

            display: none;

            justify-content: center;
            align-items: center;

            padding: 25px;

            background:
                rgba(
                    2,
                    3,
                    15,
                    0.93
                );

            backdrop-filter:
                blur(12px);
        }

        .modal.show {
            display: flex;
        }

        .modal img {
            max-width: 92vw;

            max-height: 85vh;

            object-fit: contain;

            border-radius: 15px;

            box-shadow:
                0
                0
                60px
                rgba(
                    110,
                    130,
                    255,
                    0.35
                );

            animation:
                zoom
                0.3s
                ease;
        }

        @keyframes zoom {

            from {
                opacity: 0;

                transform:
                    scale(0.85);
            }

            to {
                opacity: 1;

                transform:
                    scale(1);
            }
        }

        .close {
            position: fixed;

            top: 20px;
            right: 28px;

            z-index: 101;

            font-size: 38px;

            color: white;

            cursor: pointer;

            transition: 0.3s;
        }

        .close:hover {
            transform:
                rotate(90deg);
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            text-align: center;

            padding: 20px;

            color: #5f698f;

            font-size: 12px;

            letter-spacing: 1px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 650px) {

            header {
                padding-top: 45px;
            }

            .gallery {
                columns:
                    2
                    140px;

                column-gap: 10px;
            }

            .photo {
                margin-bottom: 10px;

                border-radius: 12px;
            }

            .gallery-header {
                margin-top: 25px;
            }
        }
    </style>
</head>


<body>

    <!-- STAR BACKGROUND -->

    <div
        class="stars"
        id="stars"
    ></div>


    <!-- HEADER -->

    <header>

        <div class="moon">
            🌙
        </div>

        <h1>
            OUR MOMENTS
        </h1>

        <p class="subtitle">
            ✦ memories written in the stars ✦
        </p>

    </header>


    <!-- MAIN -->

    <main class="container">


        <div class="gallery-header">

            <h2>
                ✦ Memories
            </h2>

            <span id="count">
                Loading...
            </span>

        </div>


        <!-- GALLERY -->

        <div
            class="gallery"
            id="gallery"
        ></div>


        <!-- MESSAGE -->

        <div
            class="message"
            id="message"
        >

            <div class="message-icon">
                🌌
            </div>

            <p>
                Loading your memories...
            </p>

        </div>


    </main>


    <!-- FOOTER -->

    <footer>

        made of memories
        & stardust ✦

    </footer>


    <!-- IMAGE MODAL -->

    <div
        class="modal"
        id="modal"
    >

        <span
            class="close"
            onclick="closeModal()"
        >
            ×
        </span>

        <img
            id="modalImage"
            src=""
            alt="Memory"
        >

    </div>


    <script>

        /* ==================================================
           🔧 GANTI BAGIAN INI
        ================================================== */


        const GITHUB_USERNAME =
            "USERNAME_GITHUB_DIA";


        const GITHUB_REPOSITORY =
            "NAMA_REPOSITORY_DIA";


        /*
           Nama folder foto kamu adalah:
           moment
        */

        const PHOTO_FOLDER =
            "moment";


        /* ==================================================
           JANGAN UBAH BAGIAN DI BAWAH
        ================================================== */


        const gallery =
            document.getElementById(
                "gallery"
            );

        const message =
            document.getElementById(
                "message"
            );

        const count =
            document.getElementById(
                "count"
            );

        const modal =
            document.getElementById(
                "modal"
            );

        const modalImage =
            document.getElementById(
                "modalImage"
            );


        /* =========================
           CREATE STARS
        ========================= */

        const stars =
            document.getElementById(
                "stars"
            );


        for (
            let i = 0;
            i < 120;
            i++
        ) {

            const star =
                document.createElement(
                    "div"
                );


            star.className =
                "star";


            star.style.left =
                Math.random() * 100
                + "%";


            star.style.top =
                Math.random() * 100
                + "%";


            star.style.animationDelay =
                Math.random() * 4
                + "s";


            stars.appendChild(star);

        }


        /* =========================
           LOAD PHOTOS FROM GITHUB
        ========================= */

        async function loadPhotos() {

            try {

                const apiURL =
                    "https://api.github.com/repos/" +
                    GITHUB_USERNAME +
                    "/" +
                    GITHUB_REPOSITORY +
                    "/contents/" +
                    PHOTO_FOLDER;


                const response =
                    await fetch(apiURL);


                if (!response.ok) {

                    throw new Error(
                        "Folder tidak ditemukan"
                    );

                }


                const files =
                    await response.json();


                /* =====================
                   FILTER IMAGE FILES
                ===================== */

                const images =
                    files.filter(
                        file => {

                            return (
                                file.type === "file" &&
                                /\.(jpg|jpeg|png|gif|webp)$/i
                                .test(
                                    file.name
                                )
                            );

                        }
                    );


                gallery.innerHTML = "";


                /* =====================
                   EMPTY
                ===================== */

                if (
                    images.length === 0
                ) {

                    message.style.display =
                        "block";


                    message.innerHTML = `

                        <div class="message-icon">
                            🌌
                        </div>

                        <p>
                            Belum ada memories
                            di sini ✦
                        </p>

                    `;


                    count.textContent =
                        "0 photos";


                    return;
                }


                /* =====================
                   HIDE MESSAGE
                ===================== */

                message.style.display =
                    "none";


                count.textContent =
                    images.length +
                    (
                        images.length === 1
                            ? " photo"
                            : " photos"
                    );


                /* =====================
                   DISPLAY PHOTOS
                ===================== */

                images.forEach(
                    (file, index) => {

                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "photo";


                        const img =
                            document.createElement(
                                "img"
                            );


                        /*
                           URL gambar GitHub
                        */

                        img.src =
                            "https://raw.githubusercontent.com/" +
                            GITHUB_USERNAME +
                            "/" +
                            GITHUB_REPOSITORY +
                            "/main/" +
                            file.path;


                        img.alt =
                            "Memory " +
                            (
                                index + 1
                            );


                        img.loading =
                            "lazy";


                        img.onclick =
                            function () {

                                openModal(
                                    img.src
                                );

                            };


                        card.appendChild(
                            img
                        );


                        gallery.appendChild(
                            card
                        );

                    }
                );


            } catch (error) {

                console.error(
                    error
                );


                count.textContent =
                    "Error";


                message.style.display =
                    "block";


                message.innerHTML = `

                    <div class="message-icon">
                        🌙
                    </div>

                    <p>
                        Galaxy belum
                        tersambung...
                    </p>

                    <small>
                        Pastikan repository
                        Public dan folder
                        "moment" tersedia.
                    </small>

                `;

            }

        }


        /* =========================
           OPEN IMAGE
        ========================= */

        function openModal(src) {

            modalImage.src =
                src;

            modal.classList.add(
                "show"
            );

        }


        /* =========================
           CLOSE IMAGE
        ========================= */

        function closeModal() {

            modal.classList.remove(
                "show"
            );

            modalImage.src = "";

        }


        /* =========================
           CLOSE WHEN CLICK OUTSIDE
        ========================= */

        modal.addEventListener(
            "click",
            function(event) {

                if (
                    event.target ===
                    modal
                ) {

                    closeModal();

                }

            }
        );


        /* =========================
           ESC KEY
        ========================= */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key ===
                    "Escape"
                ) {

                    closeModal();

                }

            }
        );


        /* =========================
           START
        ========================= */

        loadPhotos();

    </script>

</body>
</html>
```
